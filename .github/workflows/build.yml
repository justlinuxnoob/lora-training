name: Build LoRA trainer image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # every Monday: rebuild on the newest AI Toolkit

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the AI Toolkit base image is big)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          pull: true   # always start from the newest ostris/aitoolkit:latest
          no-cache: true
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lora-training:latest
            ghcr.io/${{ github.repository_owner }}/lora-training:${{ github.sha }}
